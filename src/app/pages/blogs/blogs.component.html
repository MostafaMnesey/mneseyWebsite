<main class="w-full max-w-[1536px] mx-auto">
  <app-hero-background
    [bgImage]="'images/blogs-hero.jpg'"
    [isHome]="false"
  >
    <h1 class="text-3xl text-center my-10">
      {{ "blogs.pageTitle" | translate }}
    </h1>
  </app-hero-background>

  <div class="mx-auto mb-8 py-10">
    <div
      class="w-[90%] mx-auto grid md:grid-cols-2 lg:grid-cols-3 gap-6"
      ngSkipHydration
    >
      <!-- Skeleton Placeholders -->
      @if (loading()) {
        @for (i of [1, 2, 3, 4, 5, 6]; track $index) {
          <div
            class="bg-white rounded-xl shadow-lg overflow-hidden flex flex-col h-full p-4"
          >
            <p-skeleton
              class="gray-skeleton"
              height="250px"
              styleClass="mb-4"
            ></p-skeleton>
            <p-skeleton
              width="70%"
              height="20px"
              styleClass="mb-2"
              class="gray-skeleton"
            ></p-skeleton>
            <p-skeleton
              width="90%"
              height="16px"
              styleClass="mb-2"
              class="gray-skeleton"
            ></p-skeleton>
            <p-skeleton
              width="60%"
              height="16px"
              class="gray-skeleton"
            ></p-skeleton>
          </div>
        }
      }

      <!-- Blog Cards -->
      @else {
        @for (blog of paginatedBlogs(); track $index) {
          <div
            class="bg-white rounded-xl shadow-lg overflow-hidden flex flex-col h-full"
          >
            <a [routerLink]="['/blogs', blog.slug]" class="block">
              <img
                [src]="blog.thumbnail"
                alt="Blog Image"
                class="w-full object-cover aspect-square"
              />
            </a>
            <div class="p-4 flex-1 flex flex-col">
              <h3 class="text-lg font-semibold mt-4">{{ blog.title }}</h3>
              <p class="text-gray-600 text-sm flex-grow">{{ blog.excerpt }}</p>
              <a
                [routerLink]="['/blogs', blog.slug]"
                class="text-blue-500 font-medium mt-2 inline-block"
              >
                {{ "blogs.readMore" | translate }}
                @if (currentLang() == "en") {
                  <i class="pi pi-arrow-right mx-2"></i>
                } @else {
                  <i class="pi pi-arrow-left mx-2"></i>
                }
              </a>
            </div>
          </div>
        }
      }
    </div>

    <!-- PrimeNG Pagination -->
    <div class="mt-8 flex justify-center">
      <p-paginator
        [rows]="rows"
        class="mb-5"
        [totalRecords]="blogs().length"
        [rowsPerPageOptions]="[10, 20]"
        (onPageChange)="onPageChange($event)"
      ></p-paginator>
    </div>
  </div>
</main>
