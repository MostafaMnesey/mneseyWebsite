<section
  class="w-full h-[85vh] bg-center bg-cover relative"
  [style.backgroundImage]="'url(' + bg + ')'"
>
  <div
    class="layer h-[85vh] bg-[rgba(0,0,0,.5)] w-full flex justify-center items-center container"
  >
    <h1
      class="w-[45%] mx-auto container text-white text-2xl md:text-3xl lg:text-5xl font-bold text-center leading-normal"
    >
      {{ title | translate }}
    </h1>
  </div>
</section>
