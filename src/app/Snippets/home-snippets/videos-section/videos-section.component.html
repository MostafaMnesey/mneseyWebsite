<section class="py-14 bg-gray-200 relative w-full mx-auto px-0">
  <!-- Background Pattern -->
  <div class="img absolute bottom-0 left-0 opacity-20">
    <img src="images/Vector (7).png" alt="" />
  </div>

  <div class="img hidden lg:block absolute top-0 right-0 opacity-20">
    <img src="images/Vector (8).png" alt="" />
  </div>
  <div class="page-width hidden lg:block">
    <div class="mx-auto">
      <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6 relative my-10 z-10">
        @for (card of videoCards; track card.cardIndex) {
          <div class="bg-white mx-2 rounded-2xl shadow-lg p-2 pb-3 text-center">
            <div class="relative">
              <img
                [src]="card.imgSrc"
                alt="Video Thumbnail"
                class="w-full aspect-video object-cover rounded-xl"
              />
            </div>
            <h3 class="text-xl font-bold mt-4">
              {{ card.titleKey | translate }}
            </h3>
            <p class="text-gray-600 font-semibold">
              {{ card.subtitleKey | translate }}
            </p>

            <div class="flex justify-center space-x-4 mt-4">
              <button
                (click)="showVideoDialog(card.videoId, card.cardIndex)"
                class="px-4 py-2 bg-[#0067B1] hover:bg-[#00348D] text-white rounded-full font-medium shadow-md flex"
              >
                {{ "home.videosSection.videoCards.watchButton" | translate }}
              </button>
            </div>
          </div>
        }
      </div>
    </div>
  </div>

  <div class="card block lg:hidden page-width">
    <p-carousel
      #carouselRef
      [value]="videoCards"
      [numVisible]="1"
      [numScroll]="1"
      [circular]="false"
      [responsiveOptions]="responsiveOptions"
      [style]="{ width: '100%' }"
      [draggable]="true"
      [showNavigators]="false"
      [showIndicators]="false"
      [circular]="true"
      [autoplayInterval]="5000"
    >
      <ng-template let-card #item>
        <div class="bg-white mx-2 rounded-2xl shadow-lg p-2 pb-3 text-center">
          <div class="relative">
            <img
              [src]="card.imgSrc"
              alt="Video Thumbnail"
              class="w-full aspect-video object-cover rounded-xl"
            />
          </div>
          <h3 class="text-xl font-bold mt-4">
            {{ card.titleKey | translate }}
          </h3>
          <p class="text-gray-600 font-semibold">
            {{ card.subtitleKey | translate }}
          </p>

          <div class="flex justify-center space-x-4 mt-4">
            <button
              (click)="showVideoDialog(card.videoId, card.cardIndex)"
              class="px-4 py-2 bg-[#0067B1] hover:bg-[#00348D] text-white rounded-full font-medium shadow-md flex"
            >
              {{ "home.videosSection.videoCards.watchButton" | translate }}
            </button>
          </div>
        </div>
      </ng-template>
    </p-carousel>
  </div>
</section>

<p-dialog
  [modal]="true"
  [(visible)]="visible"
  [style]="{ width: '90vw', maxWidth: '800px' }"
  [breakpoints]="{ '768px': '90vw', '576px': '95vw' }"
  [draggable]="false"
  [resizable]="false"
  [header]="videoTitle"
  styleClass="youtube-dialog"
>
  <div class="w-full aspect-video relative mb-8">
    <youtube-player
      videoId="{{ videoSrc }}"
      loadApi="true"
      [width]="'100%'"
      [height]="'100%'"
      suggestedQuality="highres"
      [playerVars]="{
        autoplay: 1,
        modestbranding: 1,
        rel: 0,
      }"
    ></youtube-player>
  </div>
</p-dialog>
