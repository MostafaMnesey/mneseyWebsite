<section class="banner">
  <div
    class="page-width mx-auto py-12 grid grid-cols-1 md:grid-cols-2 items-center gap-y-5"
  >
    <div class="text-[#0067B1]">
      <h2 class="text-3xl mb-6 font-extrabold">
        @if (brandData?.banner_title) {
          <ng-container>
            {{ brandData?.banner_title }}
          </ng-container>
        } @else {
          <ng-template>
            <p-skeleton
              width="70%"
              height="42px"
              styleClass="mb-2 light-gray-skeleton"
            ></p-skeleton>
          </ng-template>
        }
      </h2>
      <p class="text-lg text-black">
        @if (brandData?.banner_desc) {
          <ng-container>
            {{ brandData?.banner_desc }}
          </ng-container>
        } @else {
          <ng-template>
            <p-skeleton
              width="100%"
              height="24px"
              styleClass="mb-2 light-gray-skeleton"
            ></p-skeleton>
            <p-skeleton
              width="90%"
              height="24px"
              styleClass="mb-2 light-gray-skeleton"
            ></p-skeleton>
            <p-skeleton
              width="95%"
              height="24px"
              styleClass="light-gray-skeleton"
            ></p-skeleton>
          </ng-template>
        }
      </p>
    </div>
    <div class="flex justify-center lg:justify-end">
      <div
        class="w-2/3 flex items-center justify-center relative bg-white rounded-3xl my-3"
      >
        @if (brandData?.banner_image) {
          <ng-container>
            <img fetchpriority="high" [src]="brandData?.banner_image"
              class=""
              alt="{{ brandData?.name }} Products"
            />
          </ng-container>
        } @else {
          <ng-template>
            <p-skeleton
              shape="circle"
              size="15rem"
              styleClass="light-gray-skeleton"
            ></p-skeleton>
          </ng-template>
        }
      </div>
    </div>
  </div>
</section>
